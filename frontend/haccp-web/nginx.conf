# ============================================================
#  haccp-web 정적 서빙 설정 (컨테이너 내부 전용)
#
#  개발자: 박승우
#  일자: 2026-08-29
#  코멘트:
#    1) SPA 라우팅을 위해 없는 경로는 index.html 로 되돌린다 (새로고침 404 방지)
#    2) 해시가 붙은 자산만 오래 캐시하고 index.html 은 캐시하지 않는다
#    3) /manual/ 은 파일이 없으면 404. SPA 로 넘기면 빈 앱이 새 탭에 뜬다
#    4) 컨테이너 내부 listen 7070 — edge upstream(web:7070). TLS·/api 는 edge/Apache
# ============================================================

server {
    # nginx-unprivileged 는 uid 101 로 돌아 1024 미만 포트를 열 수 없다
    listen       7070;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # 텍스트 자산만 압축 — 이미 압축된 이미지·폰트를 다시 압축하면 CPU만 쓴다
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css application/javascript application/json
                      application/xml image/svg+xml;

    # Vite 산출물은 파일명에 콘텐츠 해시가 붙는다 — 내용이 바뀌면 이름이 바뀌므로 1년 캐시가 안전하다
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 화면 매뉴얼 — 파일이 없으면 SPA index 로 넘기지 않는다. 해시도 없어서 짧게만 캐시한다
    location /manual/ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }

    # index.html 은 캐시하지 않는다 — 캐시되면 새 배포 후에도 브라우저가 사라진 옛 자산을 계속 찾는다
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback — 실제 파일이 없을 때(= 클라이언트 라우트) index.html 을 돌려준다
    location / {
        try_files $uri $uri/ /index.html;
    }
}
